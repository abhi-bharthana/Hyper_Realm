[package]
name = "tauri-app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

[lib]
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }


[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2.3.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.39.6"
url = "2.5.8"
uuid = { version = "1.26.0", features = ["v4"] }
rand = "=0.8.8"
rand_core = "=0.6.4"
rand_distr = "=0.4.3"

# 🔋 Battery hardware support
battery = "0.7"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
id3 = "1.17.1"
walkdir = "2.5.0"
base64 = "0.23.1"

# 🌐 Axum & Server Dependencies
axum = "0.7.5"
tower-http = { version = "0.5", features = ["cors"] }
tokio = { version = "1.0", features = ["full"] }
urlencoding = "2.1.3"

# 🎙️ Audio Capture & Processing
cpal = "0.15"
ringbuf = "0.3"
rubato = "0.14"
hound = "3.5"
parking_lot = "0.12"
crossbeam-channel = "0.5"
chrono = "0.4"

# 🧠 AI Runtime (Pure Rust - No C++)
candle-core = "0.8.4"
candle-nn = "0.8.4"
candle-transformers = "0.8.4"
tokenizers = "0.20.4"
hf-hub = "0.3.2"
safetensors = "0.4.5"

# 🚀 ARM & BATTERY OPTIMIZATIONS (Release Build)
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"


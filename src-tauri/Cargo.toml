[package]
name = "tauri-app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2.3.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.39.6" # Latest version, perfect for ARM
url = "2.5.8"
uuid = { version = "1.26.0", features = ["v4"] }

# 🔋 Naya add kiya hai actual laptop battery hardware read karne ke liye
battery = "0.7"


# 🚀 ARM & BATTERY OPTIMIZATIONS (Release Build)
# Jab tu 'npm run tauri build' chalayega, yeh settings app ko extremely lightweight bana dengi
[profile.release]
codegen-units = 1 # Compiler poore code ko ek saath analyze karega better optimization ke liye
lto = true        # Link-Time Optimization (Binary size chota aur fast execution)
opt-level = "s"   # 's' means optimize for size (Kam RAM footprint = Battery saving)
strip = true      # Faltu debug symbols hata dega, resulting in a snappy, lightweight app
panic = "abort"   # App crash handle optimize karta hai, binary size aur chota hota hai
